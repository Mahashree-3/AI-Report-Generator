<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Academic Report Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", "Poppins", sans-serif;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        background-size: 200% 200%;
        animation: gradientShift 12s ease infinite;
        color: #fff;
        padding: 30px 15px;
      }
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .container { max-width: 700px; margin: 0 auto; }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 12px 20px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 14px;
        backdrop-filter: blur(12px);
      }
      .topbar span { font-size: 14px; color: rgba(255,255,255,0.85); }
      .btn-logout {
        background: rgba(239,68,68,0.15);
        border: 1px solid rgba(239,68,68,0.4);
        color: #fca5a5;
        padding: 7px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s;
      }
      .btn-logout:hover { background: rgba(239,68,68,0.3); }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 32px;
        backdrop-filter: blur(18px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }
      h2 { text-align: center; font-weight: 600; margin-bottom: 26px; }

      label { display: block; font-size: 13.5px; color: rgba(255,255,255,0.8); margin-bottom: 6px; font-weight: 500; }
      .mb-3 { margin-bottom: 18px; }

      .form-control {
        width: 100%;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: 0.25s;
      }
      .form-control::placeholder { color: rgba(255,255,255,0.35); }
      .form-control:focus {
        border-color: #8b5cf6;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
      }
      textarea.form-control { resize: vertical; }

      .btn-custom {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s;
      }
      .btn-custom:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(99,102,241,0.45); }

      .btn-success {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 15px;
      }
      .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(34,197,94,0.4); }

      .text-center { text-align: center; }
      .spinner {
        width: 34px; height: 34px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 10px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="topbar">
        <span>👋 Welcome, <strong id="usernameDisplay">User</strong></span>
        <div style="display:flex; gap:10px;">
          <a href="dashboard.html" class="btn-logout" style="background:rgba(139,92,246,0.15); border-color:rgba(139,92,246,0.4); color:#c4b5fd; text-decoration:none;">📊 Dashboard</a>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="card">
        <h2>🤖 AI Academic Report Generator</h2>
        <form id="reportForm">
          <div class="mb-3">
            <label>Project Title</label>
            <input type="text" id="title" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Project Description</label>
            <textarea id="description" class="form-control" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label>Workflow</label>
            <textarea id="workflow" class="form-control" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label>Languages / Tools</label>
            <input type="text" id="languages" class="form-control" required />
          </div>
          <div class="mb-3">
            <label>Upload Result Image</label>
            <input type="file" id="resultImage" class="form-control" accept="image/*" />
          </div>
          <div class="mb-3">
            <label>Figure Caption</label>
            <input type="text" id="figureCaption" class="form-control" placeholder="e.g. Result Screenshot" />
          </div>
          <button type="submit" class="btn-custom">Generate Report</button>
        </form>
        <div id="loading" class="text-center mt-3" style="display:none; margin-top:18px;">
          <div class="spinner"></div>
          <p>Generating report... please wait</p>
        </div>
        <div class="text-center mt-3">
          <button id="downloadBtn" class="btn-success" style="display:none;">Download PDF</button>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script>
      requireAuth();
      document.getElementById("usernameDisplay").textContent = getUsername() || "User";
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
