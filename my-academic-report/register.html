<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | AI Report Generator</title>
  <link rel="stylesheet" href="auth-style.css" />
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <h1>✨ Create Account</h1>
      <p>Sign up to start generating AI academic reports</p>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="yourname" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
      </div>
      <button type="submit" class="btn-auth" id="registerBtn">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const btn = document.getElementById("registerBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showAlert("Passwords do not match.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const res = await fetch("http://localhost:3000/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();

        if (!data.ok) {
          showAlert(data.error || "Registration failed.", "error");
          btn.disabled = false;
          btn.textContent = "Create Account";
          return;
        }

        showAlert("Account created! Redirecting to login...", "success");
        setTimeout(() => (window.location.href = "login.html"), 1200);
      } catch (err) {
        showAlert("Could not connect to server. Is server.js running?", "error");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
