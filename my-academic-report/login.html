<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AI Report Generator</title>
  <link rel="stylesheet" href="auth-style.css" />
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <h1>🤖 Welcome Back</h1>
      <p>Login to generate your AI academic reports</p>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn-auth" id="loginBtn">Login</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const res = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!data.ok) {
          showAlert(data.error || "Login failed.", "error");
          btn.disabled = false;
          btn.textContent = "Login";
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        window.location.href = "dashboard.html";
      } catch (err) {
        showAlert("Could not connect to server. Is server.js running?", "error");
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
